<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #1A1410; }
    .label { fill: #F5F0EA; font-size: 18px; font-weight: 500; }
    .label-small { fill: #D0C0A8; font-size: 14px; }
    .ray { stroke: #C4945A; stroke-width: 2.5; fill: none; }
    .ray-end { fill: #C4945A; }
    .rim { fill: none; stroke: #C4945A; stroke-width: 4; opacity: 0.7; }
    .subject { fill: #2a2a2a; stroke: #000000; stroke-width: 2; }
    .camera { fill: #333333; stroke: #ffffff; stroke-width: 2; }
    .light { fill: #C4945A; stroke: #8B6E4E; stroke-width: 2; }
    .axis { stroke: #555555; stroke-dasharray: 4 4; stroke-width: 1; }
  </style>
  <rect class="bg" width="800" height="600"/>

  <text x="400" y="40" text-anchor="middle" class="label" font-size="22" font-weight="700">Contralum (back light)</text>

  <line class="axis" x1="400" y1="80" x2="400" y2="560"/>
  <line class="axis" x1="150" y1="320" x2="650" y2="320"/>

  <!-- light source (top, behind subject) -->
  <circle class="light" cx="400" cy="140" r="22"/>
  <text x="400" y="105" text-anchor="middle" class="label-small">font de llum (darrere)</text>

  <!-- rays from light toward subject -->
  <line class="ray" x1="400" y1="162" x2="400" y2="262"/>
  <polygon class="ray-end" points="396,260 400,268 404,260"/>

  <!-- subject silhouette (dark with rim light) -->
  <ellipse class="subject" cx="400" cy="320" rx="40" ry="55"/>
  <!-- rim light on top edge -->
  <path class="rim" d="M 360,320 A 40,55 0 0 1 440,320"/>
  <text x="460" y="320" class="label-small">silueta amb vora lluminosa</text>

  <!-- camera -->
  <rect class="camera" x="370" y="500" width="60" height="40" rx="4"/>
  <circle class="camera" cx="400" cy="520" r="10"/>
  <text x="400" y="565" text-anchor="middle" class="label-small">càmera</text>

  <text x="400" y="80" text-anchor="middle" class="label-small" font-style="italic">Separa del fons · revela transparències · dramàtic</text>
</svg>
