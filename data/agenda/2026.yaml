title: "Dissabte 6 de juny de 2026"
items:
  - time: "09:30–10:00"
    title: "Recepció i acreditació"
    body: |
      Pagament de **10 € en metàl·lic** · Lliurament del passaport de sets (grup A o B + 3 sets assignats amb horari exacte).
  - time: "10:00–10:30"
    title: "Inauguració oficial"
    body: |
      Benvinguda a càrrec de l'Ajuntament de Parets del Vallès. Presentació de la jornada i del concurs fotogràfic.
  - time: "10:30–12:00"
    title: "Ponències teòriques"
    body: |
      **Alex Bibiano + Toni Barbany** · Tots els participants junts, ~1 h 30 min amb pausa intermèdia.

      Temes: bodegó fine art vs. fotografia de producte, composició (protagonista, plans Z, solapament), la llum com a eina narrativa, tècnica de transparents, focus stacking i tethering amb Capture One.
  - time: "12:00–12:20"
    title: "Pausa i presentació dels sets"
    body: |
      Breu recorregut pels 3 sets amb instruccions de rotació i funcionament del passaport de sets.
  - time: "12:20–13:00"
    title: "Primer bloc simultani"
    body: |
      **Grup A** ★ Shooting A1 — 1 set × 40 min\
      **Grup B** ✦ Demo al set central — Alex Bibiano + Toni Barbany, 40 min
  - time: "13:00–15:30"
    title: "Dinar"
    body: |
      Pausa lliure per dinar. Visita a l'exposició del VII Concurs «4t Memorial CHUSSA MULÀ» (FOTOgraphic 2025).
  - time: "15:30–16:50"
    title: "Segon bloc simultani"
    body: |
      **Grup A** ★ Shooting A2 — 2 sets × 40 min\
      **Grup B** ✦ Demo al set central — Alex Bibiano + Toni Barbany, 80 min
  - time: "16:50–17:00"
    title: "Pausa"
    body: ""
  - time: "17:00–19:00"
    title: "Tercer bloc simultani"
    body: |
      **Grup A** ✦ Demo al set central — Alex Bibiano + Toni Barbany, 120 min\
      **Grup B** ★ Shooting B — 3 sets × 40 min

      _La demostració es repeteix íntegrament per a cada grup._
  - time: "19:00"
    title: "Clausura"
    body: |
      Dates i informació del concurs fotogràfic · Comiat.
