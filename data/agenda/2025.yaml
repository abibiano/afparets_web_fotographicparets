title: "Dissabte 29 de novembre de 2025"
items:
  - time: "Tot el dia"
    body: |
      [VII Concurs Nacional de Fotografia “4t Memorial CHUSSA MULÀ”](/concurso/)<br><br>
      **29 de novembre de 2025:** Inici d’inscripcions i jornada oficial per captar les fotografies.<br>
      **Fins al 31 de desembre de 2025:** Termini per presentar imatges.<br>
      **10 de gener de 2026:** Veredicte del jurat.<br>
      **25 de gener de 2026, 18:00:** Entrega de premis al pavelló (Festa Major d’Hivern).
  - time: "09:30 – 10:00"
    body: |
      Recepció de participants i acreditacions a càrrec de l’equip de l’Associació Fotogràfica de Parets del Vallès.
  - time: "10:00 – 10:30"
    body: |
      Presentació i inauguració a càrrec del consistori de l’Ajuntament de Parets del Vallès i briefing del concurs amb l’equip de l’Associació Fotogràfica de Parets del Vallès.
  - time: "10:45 – 11:30"
    body: |
      **Ponència de [Danny Vela](/ponencias/danny-vela/) — Part 1: Preparació i execució del shooting.**
      Conferència sobre fotografia d’alta velocitat per esports: com prepara i executa una sessió de fotografia d’acció, amb focus en l’skateboarding i el motociclisme.
  - time: "11:45 – 12:30"
    body: |
      **Ponència de [Danny Vela](/ponencias/danny-vela/) — Part 2: Edició.**
      Taller en directe d’edició ràpida d’una fotografia amb Lightroom i Photoshop.
  - time: "12:30 – 13:00"
    body: |
      Sorteig per a les quatre persones que participaran al primer shooting.
      _Nota:_ Per garantir que els guanyadors puguin disparar amb els flaixos, porteu un disparador compatible amb Godox per a la vostra càmera.
  - time: "13:00 – 14:00"
    body: |
      **Shooting 1 / Masterclass de Danny Vela amb flash d’alta velocitat.**
      Sessió centrada en skateboard per congelar el moviment dels trucs i capturar detalls amb llum artificial (Era de Ca n’Oms).
      Els quatre guanyadors del sorteig dispararan des d’una zona preferent amb els flaixos. Si hi hagués problemes de connexió amb el flaix, reassignarem els torns per no endarrerir el programa.
      La resta de participants seguiran les indicacions de Danny; no es permetrà l’ús del flaix i caldrà col·locar-se en posicions que no molestin els qui tinguin el torn.
      Rotarem els punts de tir perquè tothom passi per la zona preferent al llarg del dia. Danny estarà microfonat i narrarà la sessió en directe.
  - time: "14:00 – 16:00"
    body: |
      Pausa lliure per dinar.
      Aprofiteu per visitar l’estand de [FOTIMA Import](https://fotimaimport.com/) i preguntar el que vulgueu sobre el material que tenen.
  - time: "16:00 – 17:30"
    body: |
      **Shooting 2 amb llum contínua.**
      Shooting temàtic de skate amb il·luminació constant per treballar el flux narratiu, les textures de la pista i la complicitat amb les i els riders.
      No s’admetrà l’ús de flaix.
      Ens dividirem en grups amb cartolines de colors per facilitar rotacions de 5 minuts; Danny avisarà els canvis amb xiulet. Amb 1 h i mitja, cada grup tindrà més d’un torn de 5 minuts.
  - time: "18:00 – 19:30"
    body: |
      **Shooting nocturn** obert a tots els participants.
      Sessió especial de skate per experimentar amb exposicions llargues, llums, fum i combinacions creatives de llum i moviment.
      Per a cada figura d’skater hi haurà un grup de quatre fotògrafs a la zona preferent disparant amb flaixos. Es faran tants grups addicionals com calgui per a qui vulgui fotografiar sense flaix; els grups aniran sortint per sorteig.
      Normes clau: si no teniu disparador per als flaixos, l’AFP en cedirà. Prohibit disparar en ràfega per sincronitzar-se amb el flaix. Qui no sigui en un grup de zona preferent podrà disparar des d’on estigui situat, però sense flaix de càmera.
  - time: "19:45"
    body: |
      Sorteig de material fotogràfic cedit per [FOTIMA Import](https://fotimaimport.com/).
      Els premis s’entregaran al moment; si la persona guanyadora no hi és, se sortejaran de nou. Es garanteix compatibilitat amb la càmera del guanyador/a; si no es disposa de l’accessori compatible al moment, FOTIMA l’enviarà a casa seva.
  - time: "20:00"
    body: |
      Clausura del FOTOGraphic 2025.
