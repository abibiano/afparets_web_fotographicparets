title: "Dissabte 29 de novembre de 2025"
items:
  - time: "Tot el dia"
    body: |
      [VII Concurs Nacional de Fotografia “4t Memorial CHUSSA MULÀ”](/concurso/)
      29 de novembre de 2025: Inici d’inscripcions i jornada oficial per captar les fotografies.
      Es poden presentar imatges fins al 31 de desembre de 2026.
      10 de gener de 2026: Veredicte del jurat.
      26 de gener de 2026 (Festa d’Hivern de Parets): Entrega de premis.
  - time: "09:30 – 10:00"
    body: |
      Recepció de participants i acreditacions a càrrec de l’equip de l’Associació Fotogràfica de Parets del Vallès.
  - time: "10:00 – 10:30"
    body: |
      Presentació i inauguració a càrrec del consistori de l’Ajuntament de Parets del Vallès i briefing del concurs amb l’equip de l’Associació Fotogràfica de Parets del Vallès.
  - time: "10:45 – 11:30"
    body: |
      **Ponència de [Danny Vela](/ponencias/danny-vela/) — Part 1: Preparació i execució del shooting.**
  - time: "11:45 – 12:30"
    body: |
      **Ponència de [Danny Vela](/ponencias/danny-vela/) — Part 2: Edició.**
  - time: "12:30 – 13:00"
    body: |
      Sorteig per a les quatre persones que participaran al primer shooting.
      _Nota:_ Porteu trigger Godox.
  - time: "13:00 – 14:00"
    body: |
      **Shooting 1 / Masterclass de Dani Vela amb flash d’alta velocitat.**
      Sessió centrada en skateboard per congelar el moviment dels trucs i capturar detalls amb llum artificial.
      Podran disparar els quatre guanyadors del sorteig.
  - time: "14:00 – 16:00"
    body: |
      Pausa lliure per dinar.
      Vegeu la guia de restaurants propers i, si és possible, reserveu amb antelació.
  - time: "16:00 – 17:30"
    body: |
      **Shooting 2 amb llum contínua.**
      Shooting temàtic de skate amb il·luminació constant per treballar el flux narratiu, les textures de la pista i la complicitat amb les i els riders.
      Activitat oberta a totes les persones participants.
  - time: "18:00 – 19:30"
    body: |
      **Shooting nocturn** obert a tots els participants.
      Sessió especial de skate per experimentar amb exposicions llargues, light trails i combinacions creatives de llum i moviment.
  - time: "19:45"
    body: |
      Sorteig de productes.
  - time: "20:00"
    body: |
      Clausura Fotographic.
