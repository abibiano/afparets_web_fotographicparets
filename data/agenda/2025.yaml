title: "Dissabte 29 de novembre de 2025"
items:
  - time: "Tot el dia"
    body: |
      [VII Concurs Nacional de Fotografia “4t Memorial CHUSSA MULÀ”](/concurso/)  
      Inscripció i lliurament d’imatges oberts durant tota la jornada.
  - time: "09:30 – 10:00"
    body: |
      Recepció de participants, acreditacions i briefing del concurs a càrrec de l’equip de l’Associació Fotogràfica de Parets del Vallès.
  - time: "10:00 – 12:00"
    body: |
      **Ponència de [Danny Vela](/ponencias/danny-vela/)**.  
      _Títol:_ “Shooting de skate: storytelling visual i flux d’edició”.  
      _Contingut:_ Preparació de sessions sobre rodes, configuracions de càmera per captar acció, control de llum natural i artificial, i micro demostració d’edició per potenciar textures i narrativa.
  - time: "12:30 – 14:00"
    body: |
      **Shooting guiat amb model de skate** per posar en pràctica els conceptes de la ponència.  
      Enfocat a angles, timing i seqüències d’acció amb assessorament directe de Danny Vela.
  - time: "14:00 – 17:00"
    body: |
      Pausa lliure per dinar i selecció de localitzacions de tarda.  
      Espai per revisar material i preparar la sessió següent.
  - time: "17:00 – 20:00"
    body: |
      **Shooting de tarda** per aprofundir en composició dinàmica, ús de llums auxiliars i narrativa visual del skate en entorns urbans.
  - time: "21:00 – 23:00"
    body: |
      **Shooting nocturn amb efectes d’il·luminació** i cloenda de la jornada.  
      Pràctica amb llum contínua, elements creatius i revisió final d’imatges.
