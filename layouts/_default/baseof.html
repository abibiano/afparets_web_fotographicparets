<!DOCTYPE html>
{{ $lang := .Site.Language.Lang | default "ca-ES" }}
<html lang="{{ $lang }}" class="h-100">
  {{- partial "head.html" . -}}

  <body class="site-body d-flex flex-column min-vh-100">
    <a class="skip-link visually-hidden-focusable" href="#main-content">
      Salta al contingut principal
    </a>
    {{- partial "header.html" . -}}
    <main id="main-content" class="site-main flex-grow-1">
      {{- block "main" . }}{{- end }}
    </main>
    {{- partial "sponsors.html" . -}}
    {{- partial "footer.html" . -}}
  </body>
</html>
