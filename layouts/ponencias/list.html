{{ define "main" }}
<section class="page-section py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-10 col-xl-9">
        <header class="page-header mb-5">
          <h1 class="page-title">{{ .Title }}</h1>
          {{ with .Description }}
          <p class="page-lead text-muted">{{ . }}</p>
          {{ end }}
        </header>
        {{ if .Content }}
        <div class="page-content content-styles mb-5">
          {{ .Content }}
        </div>
        {{ end }}
        {{ $agendaKey := .Params.agenda | default "2024" }}
        {{ partial "components/schedule.html" (dict "Page" . "Key" $agendaKey) }}
      </div>
    </div>
  </div>
</section>
{{ end }}
